version: '3.8'

services:
  app:
    image: 441293/feedzmore-service:latest
    environment:
      - SPRING_PROFILES_ACTIVE=dev-version
    container_name: feedzmore-app
    restart: always
    ports:
      - "9091:9091"  # Expose app to host aka port binding
    networks:
      - backend
    volumes:
      # HOST-PATH:CONTAINER-PATH
      - /opt/feedzmore/media/videos:/app/media/videos
      - /opt/feedzmore/media/image/post:/app/media/images/post
      - /opt/feedzmore/media/image/profile:/app/media/images/profile
      - /opt/feedzmore/logs:/app/logs

networks:
  backend:
