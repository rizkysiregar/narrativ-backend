version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: my_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: feedzmore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - backend


  feedzmore-app:
    image: rizkysiregar/feedzmore-service:latest
    container_name: feedzmore-app
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=dev-version
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/feedzmore
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    ports:
      - "9091:9091"
    networks:
      - backend
    volumes:
      - /home/rizkysiregar/feedzmore/media/videos:/home/rizkysiregar/feedzmore/media/videos
      - /home/rizkysiregar/feedzmore/media/images/post:/home/rizkysiregar/feedzmore/media/images/post
      - /home/rizkysiregar/feedzmore/media/images/profile:/home/rizkysiregar/feedzmore/media/images/profile
      - /home/rizkysiregar/feedzmore/logs:/home/rizkysiregar/feedzmore/logs

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
