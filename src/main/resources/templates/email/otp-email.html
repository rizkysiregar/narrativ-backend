<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body {
          font-family: Arial, sans-serif;
          background-color: #f6f6f6;
          padding: 20px;
        }
        .container {
          background-color: white;
          padding: 20px;
          border-radius: 10px;
          max-width: 500px;
          margin: auto;
          box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .otp {
          font-size: 28px;
          font-weight: bold;
          color: #107cd4;
          text-align: center;
          margin: 20px 0;
        }
        .footer {
          margin-top: 30px;
          font-size: 12px;
          color: #999;
          text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Hello,</h2>
    <p>We received a request to verify your identity. Use the OTP code below to proceed:</p>
    <p class="otp" th:text="${otp}">123456</p>
    <p>This code will expire in 5 minutes. Do not share this code with anyone.</p>
    <div class="footer">
        <p>If you did not request this, please ignore this email or contact our support.</p>
        <p>&copy; 2025 Feedzmore. All rights reserved.</p>
    </div>
</div>
</body>
</html>
