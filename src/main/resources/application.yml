server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH}

spring:
  messages:
    basename: i18n/messages
    # an unsupported language gets the English default, not the server's own language
    fallback-to-system-locale: false
  config:
    import: optional:file:./.env[.properties]
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE}
    encoding:
      enabled: ${SPRING_SERVLET_ENCODING_ENABLED}
      charset: ${SPRING_SERVLET_ENCODING_CHARSET}
      force: ${SPRING_SERVLET_ENCODING_FORCE}
  application:
    name: ${SPRING_APPLICATION_NAME}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  data:
    web:
      pageable:
        # endpoints that take a Pageable (users, admin lists) can ask for 2000 rows by default
        max-page-size: 100
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED}
    locations: ${SPRING_FLYWAY_LOCATIONS}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION}

google:
  client-id: ${GOOGLE_CLIENT_ID}
firebase:
  # service account key of this environment's Firebase project. In Kubernetes: path of the mounted secret.
  credentials-file: ${FIREBASE_CREDENTIALS_FILE:}
  # alternative for local development: the key itself (single line JSON). The file wins when both are set
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
app:
  logging:
    # when the access log line (HTTP.REQUEST) carries the redacted JSON request body:
    # ALWAYS (every request), ERRORS (status 400+ only) or NEVER. ERRORS by default: a body holds captions, comments
    # and names, which do not belong in the log of every successful request
    request-body: ${APP_LOGGING_REQUEST_BODY:ERRORS}
  appcheck:
    # off: nothing is checked. log: requests are checked and the outcome is logged and counted, none is refused.
    # enforce: a request without a valid Firebase App Check token is refused with 403.
    # A rule below can only be milder than this mode, so "off" here stops every check at once.
    mode: ${APP_APPCHECK_MODE:off}
    # number (digits, not the id) of this environment's Firebase project; required unless the mode is off
    project-number: ${APP_APPCHECK_PROJECT_NUMBER:}
    header: X-Firebase-AppCheck
    # Only what the mobile app calls is listed. The admin paths (/admin/**, /auth/admin/**, /auth/register-admin) are
    # not: the web admin cannot attest with Play Integrity, and those paths sit behind a JWT with the ADMIN role.
    # allowed-apps (Firebase app ids) can narrow a rule to specific apps; empty accepts any app of the project.
    rules:
      # anonymous endpoints: no JWT stands in the way yet, so these are what scripts and bots go for first
      - paths:
          - /auth/register/**
          - /auth/login
          - /auth/google
          - /auth/forgot-password
          - /auth/verify-otp
          - /auth/reset-password
      # signed in endpoints: already behind a JWT and a rate limit, so they are only observed for now
      - paths:
          - /users/**
          - /posts/**
          - /reports/**
          - /notifications/**
          - /devices/**
          - /files/**
        mode: log
  legal:
    # shown on the public privacy policy, terms and account deletion pages; prod refuses to start without it
    contact-email: ${LEGAL_CONTACT_EMAIL:}
  cors:
    # comma separated origins. default is local development only, deployed envs set APP_CORS_ALLOWED_ORIGINS
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8083,http://localhost:53375}
  rate-limit:
    feed: ${APP_RATE_LIMIT_FEED}
    post-create: ${APP_RATE_LIMIT_POST_CREATE}
    # presigned upload urls (POST /posts/upload-url), one per media, up to 5 per post
    post-upload: ${APP_RATE_LIMIT_POST_UPLOAD:60}
    interaction: ${APP_RATE_LIMIT_INTERACTION}
    default: ${APP_RATE_LIMIT_DEFAULT}
    # anonymous /auth/** calls (login, register, otp, ...), per client IP per minute
    auth: ${APP_RATE_LIMIT_AUTH:10}
    # header the edge sets with the real client IP (Cloudflare: CF-Connecting-IP). Empty = use socket address
    client-ip-header: ${APP_RATE_LIMIT_CLIENT_IP_HEADER:CF-Connecting-IP}
  storage:
    # deletes uploads that were never used (post media without a post, profile pictures nobody has); start with
    # dry-run=true and read the log
    orphan-cleanup:
      enabled: ${APP_STORAGE_ORPHAN_CLEANUP_ENABLED:false}
      dry-run: ${APP_STORAGE_ORPHAN_CLEANUP_DRY_RUN:true}
  messaging:
    idempotency-ttl-seconds: ${APP_MESSAGING_IDEMPOTENCY_TTL_SECONDS:86400}
    # one "X liked your post" push per liker and post in this period, so an unlike/like toggle cannot spam the owner
    like-dedup-ttl-seconds: ${APP_MESSAGING_LIKE_DEDUP_TTL_SECONDS:86400}


logging:
  config: ${LOGGING_CONFIG}
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    # DEBUG shows the per-request business logs (likes, logins, feed reads, event publishing...)
    com.rizkysiregar.narrativ: ${LOGGING_LEVEL_APP:INFO}
    org.flywaydb: ${LOGGING_LEVEL_ORG_FLYWAYDB:INFO}
    # libraries that log routine work at INFO: only their warnings and errors are useful
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
    org.springframework.amqp: WARN
    org.apache.kafka: WARN
    io.netty: WARN

management:
  # actuator moves to its own port when MANAGEMENT_SERVER_PORT is set (see SecurityConfig)
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY}

  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}
  endpoint:
    health:
      probes:
        enabled: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED}
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS}
      roles: ADMIN
