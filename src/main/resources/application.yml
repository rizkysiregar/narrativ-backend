server:
  port: 9091
  servlet:
    context-path: /api/v1
    encoding:
      enabled: true
      charset: UTF-8
      force: true

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  application:
    name: feedzmore-service
  profiles:
    active: dev-version
