server:
  port: 9091
  servlet:
    context-path: /api/v1
    encoding:
      enabled: true
      charset: UTF-8
      force: true

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  application:
    name: feedzmore-service
  profiles:
#    active: local-version
#    active: tailscale-version
    active: dev-version
#    active: prod-version
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

logging:
  config: classpath:logback-spring.xml

management:
  tracing:
    sampling:
      probability: 1.0 # trace every request

#  zipkin:
#    tracing:
#      endpoint: http://192.168.1.50:9412/api/v2/spans

  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always