server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH}

spring:
  config:
    import: optional:file:./.env[.properties]
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE}
    encoding:
      enabled: ${SPRING_SERVLET_ENCODING_ENABLED}
      charset: ${SPRING_SERVLET_ENCODING_CHARSET}
      force: ${SPRING_SERVLET_ENCODING_FORCE}
  application:
    name: ${SPRING_APPLICATION_NAME}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED}
    locations: ${SPRING_FLYWAY_LOCATIONS}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION}

google:
  client-id: ${GOOGLE_CLIENT_ID}
app:
  rate-limit:
    feed: ${APP_RATE_LIMIT_FEED}
    post-create: ${APP_RATE_LIMIT_POST_CREATE}
    interaction: ${APP_RATE_LIMIT_INTERACTION}
    default: ${APP_RATE_LIMIT_DEFAULT}
    # anonymous /auth/** calls (login, register, otp, ...), per client IP per minute
    auth: ${APP_RATE_LIMIT_AUTH:10}
    # header the edge sets with the real client IP (Cloudflare: CF-Connecting-IP). Empty = use socket address
    client-ip-header: ${APP_RATE_LIMIT_CLIENT_IP_HEADER:CF-Connecting-IP}
  messaging:
    idempotency-ttl-seconds: ${APP_MESSAGING_IDEMPOTENCY_TTL_SECONDS:86400}


logging:
  config: ${LOGGING_CONFIG}
  level:
    org.flywaydb: ${LOGGING_LEVEL_ORG_FLYWAYDB}

management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY}

  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}
  endpoint:
    health:
      probes:
        enabled: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED}
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS}
      roles: ADMIN
