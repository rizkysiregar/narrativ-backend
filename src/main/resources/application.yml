server:
  port: 9091
  servlet:
    context-path: /api/v1

spring:
  config:
    import: optional:file:./.env[.properties]
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
    encoding:
      enabled: true
      charset: UTF-8
      force: true
  application:
    name: feedzmore-service
  profiles:
#    active: local-version
#    active: tailscale-version
    active: dev-version
#    active: dev-kube
#    active: prod-version
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

google:
  client-id: 1023550390414-g9rql6rv1lpkmob8ndmuq6n09qmqhjpe.apps.googleusercontent.com
app:
  rate-limit:
    feed: 20
    post-create: 20
    interaction: 20
    default: 20


logging:
  config: classpath:logback-spring.xml
  level:
    org.flywaydb: DEBUG

management:
  tracing:
    sampling:
      probability: 1.0 # trace every request

#  zipkin:
#    tracing:
#      endpoint: http://192.168.1.50:9412/api/v2/spans

  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
