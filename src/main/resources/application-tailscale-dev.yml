# Run the application locally while connecting to development infrastructure via Tailscale.

server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://${TAILSCALE_DEV_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      connection-timeout: ${POSTGRES_CONNECTION_TIMEOUT}
      minimum-idle: ${POSTGRES_MINIMUM_IDLE}
      maximum-pool-size: ${POSTGRES_MAXIMUM_POOL_SIZE}
      idle-timeout: ${POSTGRES_IDLE_TIMEOUT}
      max-lifetime: ${POSTGRES_MAX_LIFETIME}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    generate-ddl: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  data:
    redis:
      host: ${TAILSCALE_DEV_HOST}
      port: ${REDIS_PORT}
      timeout: ${REDIS_TIMEOUT}
  elasticsearch:
    uris: http://${TAILSCALE_DEV_HOST}:${ELASTICSEARCH_PORT}
  rabbitmq:
    host: ${TAILSCALE_DEV_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_FEEDZMORE_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      retry:
        enabled: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

secret:
  key: ${SECRET_KEY}

logging:
  file:
    path: ${LOGGING_FILE_PATH}

otp:
  retry-time-in-seconds: ${OTP_RETRY_TIME_IN_SECONDS}

management:
  tracing:
    export:
      zipkin:
        endpoint: http://${TAILSCALE_DEV_HOST}:${ZIPKIN_PORT}/api/v2/spans

minio:
  endpoint: ${MINIO_ENDPOINT}
  bucket: ${MINIO_BUCKET}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

springdoc:
  swagger-ui:
    use-root-path: true
