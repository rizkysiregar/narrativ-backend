# Run the application on your machine against the infrastructure of docker-compose.yml.
# Nothing here touches the shared dev environment (see application-local-dev.yml for that).

server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DATABASE}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      connection-timeout: ${POSTGRES_CONNECTION_TIMEOUT}
      minimum-idle: ${POSTGRES_MINIMUM_IDLE}
      maximum-pool-size: ${POSTGRES_MAXIMUM_POOL_SIZE}
      idle-timeout: ${POSTGRES_IDLE_TIMEOUT}
      max-lifetime: ${POSTGRES_MAX_LIFETIME}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    generate-ddl: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT}
      timeout: ${REDIS_TIMEOUT}
  rabbitmq:
    host: localhost
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_NARRATIV_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      retry:
        enabled: false
  mail:
    # Mailpit from docker-compose.yml: plain SMTP, no login, no TLS
    host: localhost
    port: ${MAIL_PORT}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

secret:
  key: ${SECRET_KEY}

logging:
  file:
    path: ${LOGGING_FILE_PATH}

minio:
  endpoint: ${MINIO_ENDPOINT}
  bucket: ${MINIO_BUCKET}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

springdoc:
  swagger-ui:
    use-root-path: true

app:
  registration:
    # the OTP mail lands in Mailpit (http://localhost:8025), so the real flow can be tried
    email-verification:
      enabled: true
