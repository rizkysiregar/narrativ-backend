image:
  repository: rizkysiregar/feedzmore-service
  tag: 052634c
  pullPolicy: Always

replicaCount: 2

namespace: app

service:
  port: 80
  targetPort: 9091

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

probes:
  path: /api/v1/actuator/health
  port: 9091
  initialDelaySeconds: 60
  periodSeconds: 15

configmap:
  SPRING_PROFILES_ACTIVE: dev
  SERVER_PORT: "9091"
  SERVER_SERVLET_CONTEXT_PATH: /api/v1
  SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 100MB
  SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 100MB
  SPRING_SERVLET_ENCODING_ENABLED: "true"
  SPRING_SERVLET_ENCODING_CHARSET: UTF-8
  SPRING_SERVLET_ENCODING_FORCE: "true"
  SPRING_APPLICATION_NAME: feedzmore-service
  SPRING_FLYWAY_ENABLED: "false"
  SPRING_FLYWAY_LOCATIONS: classpath:db/migration
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
  SPRING_FLYWAY_BASELINE_VERSION: "1"
  APP_RATE_LIMIT_FEED: "20"
  APP_RATE_LIMIT_POST_CREATE: "20"
  APP_RATE_LIMIT_INTERACTION: "20"
  APP_RATE_LIMIT_DEFAULT: "20"
  LOGGING_CONFIG: classpath:logback-spring.xml
  LOGGING_LEVEL_ORG_FLYWAYDB: DEBUG
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  DEV_INFRA_HOST: 192.168.1.50
  POSTGRES_PORT: "5433"
  POSTGRES_DATABASE: feedzmore
  POSTGRES_CONNECTION_TIMEOUT: "20000"
  POSTGRES_MINIMUM_IDLE: "10"
  POSTGRES_MAXIMUM_POOL_SIZE: "20"
  POSTGRES_IDLE_TIMEOUT: "30000"
  POSTGRES_MAX_LIFETIME: "90000"
  REDIS_PORT: "6379"
  REDIS_TIMEOUT: "60000"
  ELASTICSEARCH_PORT: "9200"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VIRTUAL_HOST: /feedzmore
  MAIL_HOST: smtp.gmail.com
  MAIL_PORT: "587"
  LOGGING_FILE_PATH: ./logs
  OTP_RETRY_TIME_IN_SECONDS: "60"
  ZIPKIN_PORT: "9411"
  MINIO_ENDPOINT: https://infra-minio.rizkysiregar.my.id/
  MINIO_BUCKET: feedzmore-dev

# Secrets — override these at deploy time via --set or Jenkins credentials
# Never commit real values here
secrets:
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  REDIS_PASSWORD: ""
  RABBITMQ_USERNAME: ""
  RABBITMQ_FEEDZMORE_PASSWORD: ""
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  GOOGLE_CLIENT_ID: ""
  SECRET_KEY: ""
  MINIO_ACCESS_KEY: ""
  MINIO_SECRET_KEY: ""
